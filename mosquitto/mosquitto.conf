# Mosquitto 설정 — 스마트팜 자동제어 브로커 (SPEC 6.2 / 7.2)
#
# ESP32 는 sensor/data 로 측정값을 올리고, 서버는 control/command 로 급수·환기·
# 조명 명령을 내린다. 토픽 계약은 docs/ARCHITECTURE.md 11.1 절이다.

listener 1883 0.0.0.0

# 프로토타입 전용. 실증 단계에서는 password_file + TLS(8883) 로 바꾼다 —
# 서버의 MQTT_BROKER_URL 은 mqtt://user:pass@host:1883 형식을 이미 파싱한다.
allow_anonymous true

# 재시작 후에도 QoS 1 세션과 미전달 메시지를 유지한다. 서버는 control/command 를
# qos=1 로 발행하므로, 브로커가 잠깐 죽어도 명령이 사라지지 않는다.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# 컨테이너 로그로 내보낸다 (docker compose logs mosquitto).
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# 센서 페이로드는 200바이트 남짓이다. 넉넉히 잡아도 8KB 면 충분하다.
max_packet_size 8192
