; ESP32 엣지 제어기 — PlatformIO 프로젝트 (SPEC 6.2 / 7.2)
;
;   pio run                 펌웨어 빌드
;   pio run -t upload       보드에 굽기
;   pio device monitor      시리얼 로그
;   pio test -e native      오프라인 안전 제어 호스트 테스트
;
; PlatformIO 가 없어도 안전 규칙은 검증할 수 있다: ./run_host_tests.sh
;
; 라이브러리 버전은 전부 고정한다. 몇 달 뒤에 받아도 같은 바이너리가 나와야
; 한다 (docs/ARCHITECTURE.md 6절, 결정론).

[platformio]
default_envs = esp32dev

[env]
lib_ldf_mode = deep+

; --- 실물 보드 -------------------------------------------------------------
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.0
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.14
    claws/BH1750@1.3.0

build_flags =
    -Wall
    -DSMARTFARM_ID=1
    ; Wi-Fi / 브로커 / API 주소는 현장마다 다르다. 비밀번호를 커밋하지 않으려면
    ; firmware/secrets.ini 를 만들고 아래 extra_configs 주석을 푼다 (README 참고).
    -DWIFI_SSID='"farmflow"'
    -DWIFI_PASSWORD='"changeme"'
    -DMQTT_HOST='"192.168.0.10"'
    -DAPI_BASE_URL='"http://192.168.0.10:8000"'

; --- 호스트 테스트 ---------------------------------------------------------
; lib/farmcontrol 은 Arduino 에 의존하지 않는다. 그래서 오프라인 안전 규칙을
; 보드 없이 그대로 돌려볼 수 있다.
[env:native]
platform = native
test_framework = custom
build_flags = -std=c++17 -Wall -Wextra
build_src_filter = -<*>
test_build_src = no

; --- 비밀정보 분리 (선택) --------------------------------------------------
; extra_configs = secrets.ini
