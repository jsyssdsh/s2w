services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LLM_MOCK=true
      - DB_PATH=/tmp/test.db
      - SEED_ON_START=true
    ports:
      - "8000:8000"
    healthcheck:
      # python:3.12-slim ships no curl, so poll with the interpreter instead.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0-jammy
    depends_on:
      app:
        condition: service_healthy
    environment:
      - BASE_URL=http://app:8000
    working_dir: /work
    volumes:
      - ./test:/work
    command: npx playwright test
