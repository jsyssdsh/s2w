# CI 스택 — 전체 E2E 를 한 명령으로 돌린다.
#
#   docker compose -f docker-compose.test.yml up --build --exit-code-from playwright
#
# 서비스는 넷이고 순서는 depends_on 이 강제한다:
#   mosquitto → app → sensor-sim(SPEC 7.2 자동제어 한 바퀴) → playwright
services:
  # SPEC 6.2 / 7.2 — ESP32 ↔ 서버 실시간 통신. 운영 스택과 같은 설정을 쓴다.
  mosquitto:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-h",
          "localhost",
          "-t",
          "$$SYS/broker/uptime",
          "-C",
          "1",
          "-W",
          "3",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LLM_MOCK=true
      - DB_PATH=/tmp/test.db
      - SEED_ON_START=true
      # 브리지를 켜야 sensor/data 구독과 control/command 발행이 돈다 (SPEC 7.2).
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
    # 호스트 포트를 열지 않는다. Playwright 는 컴포즈 네트워크에서 서비스 이름으로
    # (BASE_URL=http://app:8000) 접근하므로 바인딩이 필요 없고, 8000 을 잡으면
    # 개발 스택(docker-compose.yml)이나 다른 워크트리의 E2E 와 충돌해
    # "Bind for 0.0.0.0:8000 failed: port is already allocated" 로 죽는다.
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim ships no curl, so poll with the interpreter instead.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # SPEC 7.2 시나리오를 실제 브로커로 한 번 태우고 나서 healthy 가 된다.
  # 종료하지 않고 대기하는 이유는 스크립트 주석에 있다.
  sensor-sim:
    image: python:3.12-slim
    volumes:
      - ./tools:/tools:ro
      - ./test/run-sensor-scenario.sh:/run-sensor-scenario.sh:ro
    environment:
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - FARMFLOW_API_BASE_URL=http://app:8000
      - SMARTFARM_ID=2
    entrypoint: ["sh", "/run-sensor-scenario.sh"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/sensor-scenario-done"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      mosquitto:
        condition: service_healthy
      app:
        condition: service_healthy

  playwright:
    # Built rather than pulled: the runner needs `npm ci` to have installed
    # @playwright/test inside the image before the specs can load.
    build:
      context: ./test
    depends_on:
      app:
        condition: service_healthy
      sensor-sim:
        condition: service_healthy
    environment:
      - BASE_URL=http://app:8000
