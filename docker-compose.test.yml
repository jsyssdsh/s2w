services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - LLM_MOCK=true
      - DB_PATH=/tmp/test.db
      - SEED_ON_START=true
    ports:
      - "8000:8000"
    healthcheck:
      # python:3.12-slim ships no curl, so poll with the interpreter instead.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  playwright:
    # Built rather than pulled: the runner needs `npm ci` to have installed
    # @playwright/test inside the image before the specs can load.
    build:
      context: ./test
    depends_on:
      app:
        condition: service_healthy
    environment:
      - BASE_URL=http://app:8000
